# nginx/capital_humano.conf — reverse proxy + estáticos para Capital Humano
# Montado en el contenedor nginx como /etc/nginx/conf.d/default.conf

upstream capital_humano_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;                 # reemplazar por el dominio real

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://capital_humano_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

